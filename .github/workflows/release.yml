name: Release

on:
  push:
    tags:
      - 'v*.*.*'

# Publishes linux/amd64 images on tags matching v<semver>. (arm64 was dropped:
# QEMU-emulated C++ builds took hours and the deploy targets are amd64.) Uses the repo's
# existing multi-stage Dockerfile — runtime is the default final stage,
# worker-runtime is the worker image. Both get tagged with the git tag and
# :latest.
#
# Registry: GHCR `ghcr.io/moveeeax/cpp-rapid-rest-template{,-worker,-frontend}` — this MUST
# match what the runtime actually pulls. docker/docker-compose.yml and
# helm/*/values-prod.yaml both deploy `ghcr.io/moveeeax/…`. Pushing to
# GHCR here would produce images nothing deploys. Requires repo secrets
# DOCKER_USERNAME / DOCKER_PASSWORD.
#
# Build order:
#   1. build-staging  — push multi-arch under :<version>-staging (no :latest yet)
#   2. scan           — Trivy gates on the staging tags; fails release on fixable CRITICAL
#   3. promote        — imagetools create stitches staging digest into :<version>/:latest
#   4. supply-chain   — SPDX SBOM per image (syft), cosign keyless sign + SBOM attest by digest
#   5. github-release — GitHub Release notes + SBOM assets (needs: promote, supply-chain)
#
# Least privilege: no workflow-wide token scope. Each job declares only the
# permissions it actually needs.
permissions: {}

env:
  # Single source of truth for the published image namespace. Derived from the
  # repo so a FORK publishes under its own owner/name with zero edits — the
  # hardcoded upstream namespace forced every fork to either patch this line
  # (and carry the diff forever) or silently push images nothing deploys
  # (downstream bump: site b676430 rebranded this by hand and left compose/
  # helm pointing at the upstream images). NOTE: docker/docker-compose.yml and
  # helm values default to the UPSTREAM ghcr.io/moveeeax images — a fork that
  # releases its own images points those at ${IMAGE_NAME} (init-project.sh
  # rewrites them, or override APP_IMAGE/WORKER_IMAGE/image.repository).
  IMAGE_NAME: ghcr.io/${{ github.repository }}

jobs:
  build-staging:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read   # checkout
      packages: write  # push images to GHCR
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Extract version
        id: ver
        run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: Log in to GHCR
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6  # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069  # v4.4.1

      # Push under a staging tag so Trivy can scan before :latest/:version are published.
      # The promote job (needs: scan) will move these digests into the final tags via
      # imagetools create (no rebuild — digest-level operation).
      - name: Build and push app image (multi-arch, staging tag)
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc  # v7.4.0
        with:
          context: .
          file: docker/Dockerfile
          target: runtime
          platforms: linux/amd64
          push: true
          # APP_VERSION stamps the tag into the binary (Core::version(),
          # GET /health) — without it the image reports the baked CMake
          # fallback, which went three releases stale before anyone noticed.
          build-args: APP_VERSION=${{ steps.ver.outputs.version }}
          tags: ${{ env.IMAGE_NAME }}:${{ steps.ver.outputs.version }}-staging
          cache-from: type=gha
          cache-to: type=gha,mode=max
          sbom: true
          provenance: mode=max

      - name: Build and push worker image (multi-arch, staging tag)
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc  # v7.4.0
        with:
          context: .
          file: docker/Dockerfile
          target: worker-runtime
          platforms: linux/amd64
          push: true
          build-args: APP_VERSION=${{ steps.ver.outputs.version }}
          tags: ${{ env.IMAGE_NAME }}-worker:${{ steps.ver.outputs.version }}-staging
          cache-from: type=gha
          cache-to: type=gha,mode=max
          sbom: true
          provenance: mode=max

      - name: Build and push frontend image (staging tag)
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc  # v7.4.0
        with:
          context: .
          file: frontend/Dockerfile
          platforms: linux/amd64
          push: true
          tags: ${{ env.IMAGE_NAME }}-frontend:${{ steps.ver.outputs.version }}-staging
          cache-from: type=gha
          cache-to: type=gha,mode=max
          sbom: true
          provenance: mode=max

  scan:
    runs-on: ubuntu-latest
    needs: build-staging
    permissions:
      contents: read
      packages: read   # pull staging images from GHCR for scanning
    steps:
      - name: Extract version
        id: ver
        run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: Log in to GHCR
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6  # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Vulnerability gate — scan the staging tags before they get promoted to
      # :latest/:version. Fails on a fixable CRITICAL so nothing broken ships.
      # platform: linux/amd64 matches the most common deployment target; the
      # multi-arch manifest index requires an explicit platform hint for Trivy.
      # Trivy is installed straight from its GitHub release and verified
      # against the release's own checksums.txt. trivy-action/setup-trivy go
      # through contrib/install.sh, which since aquasecurity/trivy#9962
      # downloads from get.trivy.dev; that domain stopped resolving on
      # 2026-11-04 (aquasecurity/trivy#11537) and broke every release.
      - name: Install Trivy
        env:
          TRIVY_VERSION: 0.70.0
        run: |
          set -euo pipefail
          base="https://github.com/aquasecurity/trivy/releases/download/v${TRIVY_VERSION}"
          tarball="trivy_${TRIVY_VERSION}_Linux-64bit.tar.gz"
          cd "$RUNNER_TEMP"
          curl -fsSLO "${base}/${tarball}"
          curl -fsSLO "${base}/trivy_${TRIVY_VERSION}_checksums.txt"
          grep " ${tarball}\$" "trivy_${TRIVY_VERSION}_checksums.txt" | sha256sum -c -
          mkdir -p "$RUNNER_TEMP/trivy-bin"
          tar -xzf "$tarball" -C "$RUNNER_TEMP/trivy-bin" trivy
          echo "$RUNNER_TEMP/trivy-bin" >> "$GITHUB_PATH"

      - name: Scan app image (Trivy)
        run: >-
          trivy image --severity CRITICAL --ignore-unfixed --exit-code 1
          --platform linux/amd64
          "${IMAGE_NAME}:${{ steps.ver.outputs.version }}-staging"

      - name: Scan worker image (Trivy)
        run: >-
          trivy image --severity CRITICAL --ignore-unfixed --exit-code 1
          --platform linux/amd64
          "${IMAGE_NAME}-worker:${{ steps.ver.outputs.version }}-staging"

  promote:
    runs-on: ubuntu-latest
    needs: scan
    permissions:
      contents: read
      packages: write  # promote staging digests to release tags in GHCR
    steps:
      - name: Extract version
        id: ver
        run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: Log in to GHCR
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6  # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069  # v4.4.1

      # Promote by digest — imagetools create stitches the already-pushed staging
      # digest into the final public tags without any layer re-pull or rebuild.
      - name: Promote app image to version + latest
        run: |
          docker buildx imagetools create \
            -t ${{ env.IMAGE_NAME }}:${{ steps.ver.outputs.version }} \
            -t ${{ env.IMAGE_NAME }}:latest \
            ${{ env.IMAGE_NAME }}:${{ steps.ver.outputs.version }}-staging

      - name: Promote worker image to version + latest
        run: |
          docker buildx imagetools create \
            -t ${{ env.IMAGE_NAME }}-worker:${{ steps.ver.outputs.version }} \
            -t ${{ env.IMAGE_NAME }}-worker:latest \
            ${{ env.IMAGE_NAME }}-worker:${{ steps.ver.outputs.version }}-staging
          docker buildx imagetools create \
            -t ${{ env.IMAGE_NAME }}-frontend:${{ steps.ver.outputs.version }} \
            -t ${{ env.IMAGE_NAME }}-frontend:latest \
            ${{ env.IMAGE_NAME }}-frontend:${{ steps.ver.outputs.version }}-staging

  # Supply chain: for each published image, generate an SPDX SBOM with syft,
  # sign the image keyless with cosign (OIDC — Fulcio binds the signature to
  # THIS workflow's identity, no long-lived key to leak or rotate), and attach
  # the SBOM as a cosign attestation. Everything operates on the manifest
  # DIGEST, so the signature covers every tag pointing at it (:<version>,
  # :latest and the -staging tag are the same digest after promote).
  # Verify commands: SECURITY.md § "Verifying release images and SBOMs".
  supply-chain:
    runs-on: ubuntu-latest
    needs: promote
    permissions:
      packages: write  # push cosign signatures/attestations next to the images in GHCR
      id-token: write  # mint the OIDC token cosign trades for a Fulcio signing cert
    steps:
      - name: Extract version
        id: ver
        run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: Log in to GHCR
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6  # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069  # v4.4.1

      - name: Install cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6  # v4.1.2

      - name: Install syft
        id: syft
        uses: anchore/sbom-action/download-syft@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c  # v0.24.3

      - name: SBOM + sign + attest (app, worker, frontend)
        env:
          VERSION: ${{ steps.ver.outputs.version }}
          SYFT: ${{ steps.syft.outputs.cmd }}
        run: |
          set -euo pipefail
          mkdir -p sbom
          for suffix in "" "-worker" "-frontend"; do
            image="${IMAGE_NAME}${suffix}"
            digest=$(docker buildx imagetools inspect "${image}:${VERSION}" \
              --format '{{println .Manifest.Digest}}')
            base=$(basename "${image}")
            sbom_file="sbom/${base}-${VERSION}.spdx.json"
            echo "::group::${image}@${digest}"
            "${SYFT}" "registry:${image}@${digest}" -o "spdx-json=${sbom_file}"
            cosign sign --yes "${image}@${digest}"
            cosign attest --yes --type spdxjson --predicate "${sbom_file}" "${image}@${digest}"
            echo "::endgroup::"
          done

      # Hand the SBOM files to the github-release job so they land on the
      # Release page as downloadable assets (same bytes as the attestation).
      - name: Upload SBOMs for the release job
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: sboms
          path: sbom/*.spdx.json
          if-no-files-found: error

  github-release:
    runs-on: ubuntu-latest
    needs: [promote, supply-chain]
    permissions:
      contents: write  # create the GitHub Release + tag notes
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0  # needed for CHANGELOG parsing

      - name: Fetch SBOMs
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333  # v8.0.2
        with:
          name: sboms
          path: sbom

      - name: Create GitHub Release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64  # v3.0.3
        with:
          generate_release_notes: true
          draft: false
          prerelease: ${{ contains(github.ref_name, '-') }}
          files: sbom/*.spdx.json
